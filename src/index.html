<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preload"
      href="./fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/InterVariable-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Urbanist-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Urbanist-Italic-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
    <title>js form validation</title>
  </head>
  <body>
    <div class="grid">
      <h1 class="title">Registration</h1>
      <form novalidate>
        <label for="email">Email*</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required />
        <label for="country">Country*</label>
        <input type="text" id="country" name="country" placeholder="Malaysia" required />
        <label for="postal-code">Postal Code*</label>
        <input
          type="tel"
          id="postal-code"
          name="postal-code"
          placeholder="12345"
          minlength="5"
          maxlength="5"
          required
        />
        <label for="pw">Password*</label>
        <input type="password" id="pw" name="pw" placeholder="password123" required />
        <label for="pw-confirm">Confirm Password*</label>
        <input
          type="password"
          id="pw-confirm"
          name="pw-confirm"
          placeholder="password123"
          required
        />
      </form>
    </div>
  </body>
</html>
