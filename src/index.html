<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preload"
      href=".assets/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href=".assets/fonts/InterVariable-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href=".assets/fonts/Urbanist-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href=".assets/fonts/Urbanist-Italic-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="main.js" defer></script>
    <title>js form validation</title>
  </head>
  <body>
    <div class="main-container">
      <h1 class="title">Registration</h1>
      <form novalidate class="form-container">
        <section class="email">
          <label for="email">Email*</label>
          <input type="email" id="email" name="email" placeholder="example@mail.com" required />
          <div class="email error-box"></div>
        </section>
        <section class="country">
          <label for="country">Country*</label>
          <input type="text" id="country" name="country" placeholder="Malaysia" required />
          <div class="country error-box"></div>
        </section>
        <section class="postal-code">
          <label for="postal-code">Postal Code*</label>
          <input
            type="tel"
            id="postal-code"
            name="postal-code"
            placeholder="12345"
            minlength="5"
            maxlength="5"
            required
          />
          <div class="postal-code error-box"></div>
        </section>
        <section class="pw">
          <label for="pw">Password*</label>
          <input
            type="password"
            id="pw"
            name="pw"
            placeholder="password123"
            pattern="(?=.*[0-9])(?=.*[!@#$%^&*]).*"
            minlength="8"
            required
          />
          <div class="pw error-box"></div>
        </section>
        <section class="pw-confirm">
          <label for="pw-confirm">Confirm Password*</label>
          <input
            type="password"
            id="pw-confirm"
            name="pw-confirm"
            placeholder="password123"
            pattern="(?=.*[0-9])(?=.*[!@#$%^&*]).*"
            minlength="8"
            required
          />
          <div class="pw-confirm error-box"></div>
        </section>
        <section class="submit">
          <label for="submit">Submit Information</label>
          <button type="submit">SUBMIT</button>
          <div class="submit error-box"></div>
        </section>
      </form>
    </div>
  </body>
</html>
